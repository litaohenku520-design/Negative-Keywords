<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMZ 否词工具工作台</title>
  <script>
    window.global = window;
    window.process = window.process || { env: { NODE_ENV: 'production' }, version: '' };
  </script>
  <style>
    :root {
      --neg-bg: #f1f5f9;
      --neg-surface: #ffffff;
      --neg-sub-surface: #f8fafc;
      --neg-border: rgba(15, 23, 42, 0.08);
      --neg-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
      --neg-row-deny: #fff5f5;
      --neg-row-deny-hover: #fee2e2;
      --neg-row-keep: #f3fcf6;
      --neg-row-keep-hover: #dcfce7;
      --neg-row-review: #fffbeb;
      --neg-row-review-hover: #fef3c7;
    }
    html[data-theme='dark'], body[data-theme='dark'] {
      --neg-bg: #0f1117;
      --neg-surface: #181b23;
      --neg-sub-surface: #1f2430;
      --neg-border: rgba(255, 255, 255, 0.09);
      --neg-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      --neg-row-deny: rgba(239, 68, 68, 0.09);
      --neg-row-deny-hover: rgba(239, 68, 68, 0.16);
      --neg-row-keep: rgba(34, 197, 94, 0.08);
      --neg-row-keep-hover: rgba(34, 197, 94, 0.15);
      --neg-row-review: rgba(245, 158, 11, 0.09);
      --neg-row-review-hover: rgba(245, 158, 11, 0.16);
    }
    * {
      box-sizing: border-box;
    }
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: var(--neg-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .neg-app-shell {
      max-width: 1680px;
      margin: 0 auto;
      padding: 14px 18px 28px;
    }
    .neg-app-shell .ant-card {
      border-radius: 12px;
      border: 1px solid var(--neg-border);
      box-shadow: var(--neg-shadow);
    }
    .neg-kpi-card {
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      overflow: hidden;
    }
    .neg-kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.09);
    }
    .neg-app-shell .ant-statistic-title {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .neg-app-shell .ant-statistic-content {
      font-variant-numeric: tabular-nums;
    }
    /* 现代导航 Tab 条 */
    .neg-app-shell .ant-tabs-card > .ant-tabs-nav {
      margin-bottom: 14px !important;
      background: var(--neg-surface);
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid var(--neg-border);
      box-shadow: var(--neg-shadow);
    }
    .neg-app-shell .ant-tabs-card > .ant-tabs-nav::before {
      display: none !important;
    }
    .neg-app-shell .ant-tabs-card > .ant-tabs-nav .ant-tabs-tab {
      border: none !important;
      background: transparent !important;
      border-radius: 8px !important;
      padding: 6px 13px !important;
      margin-right: 4px !important;
      font-weight: 500;
      transition: all 0.16s ease;
    }
    .neg-app-shell .ant-tabs-card > .ant-tabs-nav .ant-tabs-tab:hover {
      background: var(--neg-sub-surface) !important;
    }
    .neg-app-shell .ant-tabs-card > .ant-tabs-nav .ant-tabs-tab-active {
      background: rgba(37, 99, 235, 0.1) !important;
      font-weight: 600;
    }
    /* 操作区微分区 */
    .neg-toolbar-row {
      background: var(--neg-sub-surface);
      border: 1px solid var(--neg-border);
      border-radius: 9px;
      padding: 8px 12px;
    }
    /* 表格与语义行底色 */
    .neg-app-shell .ant-table-wrapper {
      background: var(--neg-surface);
      border-radius: 12px;
      border: 1px solid var(--neg-border);
      box-shadow: var(--neg-shadow);
      overflow: hidden;
    }
    .neg-app-shell .ant-table-wrapper .ant-table-thead > tr > th {
      font-weight: 600;
      font-size: 12.5px;
      background: var(--neg-sub-surface);
    }
    .neg-app-shell .ant-table-pagination.ant-pagination {
      margin: 12px 16px !important;
    }
    .row-deny > td { background: var(--neg-row-deny) !important; }
    .row-deny:hover > td { background: var(--neg-row-deny-hover) !important; }
    .row-keep > td { background: var(--neg-row-keep) !important; }
    .row-keep:hover > td { background: var(--neg-row-keep-hover) !important; }
    .row-review > td { background: var(--neg-row-review) !important; }
    .row-review:hover > td { background: var(--neg-row-review-hover) !important; }
    .neg-app-shell .ant-btn {
      border-radius: 7px;
      font-weight: 500;
    }
    .neg-app-shell .ant-tag {
      border-radius: 6px;
    }
    .neg-app-shell .ant-alert {
      border-radius: 10px;
    }
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
/*__APP_BUNDLE__*/
  </script>
</body>
</html>
