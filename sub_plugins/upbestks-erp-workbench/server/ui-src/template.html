<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMZ 探险者 · 快捷工作台</title>
  <style>
    :root {
      --erp-primary: #3370ff;
      --erp-primary-bg: #eaf1ff;
      --erp-bg: #f7f8fa;
      --erp-surface: #ffffff;
      --erp-border: #e5e6eb;
      --erp-text: #1d2129;
      --erp-text-secondary: #86909c;
    }
    html, body, #root {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--erp-bg);
      color: var(--erp-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .erp-shell {
      padding: 12px 14px;
      background: var(--erp-bg);
      min-height: 100vh;
    }
    .erp-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      background: var(--erp-surface);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--erp-border);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }
    .erp-page-header__main {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .erp-page-header__icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--erp-primary-bg);
      color: var(--erp-primary);
      font-size: 18px;
    }
    .row-deny td { background: #fff2f0 !important; }
    .row-keep td { background: #f6ffed !important; }
    .row-review td { background: #fffbe6 !important; }
    .row-danger td { background: #fff1f0 !important; }
    .row-warning td { background: #fffbe6 !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    /*__APP_BUNDLE__*/
  </script>
</body>
</html>
