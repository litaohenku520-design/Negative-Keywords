<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPBestKS 产品分析可视化</title>
  <style>
    :root {
      --bg-canvas: var(--color-background-primary, #f8fafc);
      --bg-surface: var(--color-background-secondary, #ffffff);
      --bg-subtle: #f1f5f9;
      --bg-hover: #e2e8f0;
      --text-main: var(--color-text-primary, #0f172a);
      --text-muted: var(--color-text-secondary, #64748b);
      --text-light: #94a3b8;
      --border-default: var(--color-border-primary, #e2e8f0);
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --emerald: #059669;
      --emerald-soft: rgba(5, 150, 105, 0.1);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.1);
      --rose: #e11d48;
      --rose-soft: rgba(225, 29, 72, 0.1);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.1);
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    [data-theme="dark"] {
      --bg-canvas: var(--color-background-primary, #090d16);
      --bg-surface: var(--color-background-secondary, #0f172a);
      --bg-subtle: #162032;
      --bg-hover: #1e293b;
      --text-main: var(--color-text-primary, #f8fafc);
      --text-muted: var(--color-text-secondary, #94a3b8);
      --text-light: #64748b;
      --border-default: var(--color-border-primary, #334155);
      --primary: #60a5fa;
      --primary-soft: rgba(96, 165, 250, 0.15);
      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.15);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.15);
      --rose: #fb7185;
      --rose-soft: rgba(251, 113, 133, 0.15);
      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.15);
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 14px 28px;
      background: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .brand-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .brand-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--border-default);
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
    }
    .tab-btn {
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 11px 13px;
      box-shadow: var(--shadow-sm);
    }
    .kpi-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .kpi-val { font-size: 20px; font-weight: 800; margin: 4px 0 3px; letter-spacing: -0.02em; }
    .kpi-sub { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }

    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 13px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .panel-title { font-size: 13.5px; font-weight: 700; }
    .panel-note { font-size: 11px; color: var(--text-muted); }

    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
    }
    .badge-green { background: var(--emerald-soft); color: var(--emerald); }
    .badge-red { background: var(--rose-soft); color: var(--rose); }
    .badge-amber { background: var(--amber-soft); color: var(--amber); }
    .badge-blue { background: var(--primary-soft); color: var(--primary); }
    .badge-purple { background: var(--purple-soft); color: var(--purple); }
    .badge-gray { background: var(--bg-subtle); color: var(--text-muted); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--border-default);
      text-align: right;
      white-space: nowrap;
    }
    th {
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-weight: 700;
      position: sticky;
      top: 0;
      cursor: pointer;
    }
    th:first-child, td:first-child { text-align: left; }
    tr:hover td { background: var(--bg-subtle); }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }
    input[type="text"], select {
      background: var(--bg-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-default);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 12px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .color-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      cursor: pointer;
      transition: transform .12s;
    }
    .color-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.3);
      vertical-align: middle;
    }

    .matrix-cell {
      text-align: center !important;
      font-weight: 600;
      border-radius: 4px;
      font-size: 11px;
    }

    .toast {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      background: var(--emerald-soft);
      color: var(--emerald);
      font-weight: 600;
      font-size: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 125px 1fr 78px;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 11.5px;
    }
    .bar-track {
      height: 14px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill { height: 100%; border-radius: 999px; }
  </style>
</head>
