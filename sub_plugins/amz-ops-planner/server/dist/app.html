<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>亚马逊运营计划看板</title>
  <style>
    :root {
      --bg: var(--color-background-primary, #ffffff);
      --bg-sub: var(--color-background-secondary, #f8fafc);
      --bg-card: var(--color-background-tertiary, #f1f5f9);
      --text: var(--color-text-primary, #0f172a);
      --text-sub: var(--color-text-secondary, #475569);
      --border: var(--color-border-primary, #cbd5e1);
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --orange: #ea580c;
      --orange-bg: #ffedd5;
      --green: #059669;
      --green-bg: #d1fae5;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --purple: #7c3aed;
      --purple-bg: #ede9fe;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);
      --font: var(--font-sans, "Inter", "Microsoft YaHei", system-ui, -apple-system, sans-serif);
    }
    [data-theme="dark"] {
      --bg: var(--color-background-primary, #0b1120);
      --bg-sub: var(--color-background-secondary, #131c31);
      --bg-card: var(--color-background-tertiary, #1e293b);
      --text: var(--color-text-primary, #f1f5f9);
      --text-sub: var(--color-text-secondary, #94a3b8);
      --border: var(--color-border-primary, #293548);
      --accent: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --orange: #fb923c;
      --orange-bg: rgba(249, 115, 22, 0.18);
      --green: #34d399;
      --green-bg: rgba(16, 185, 129, 0.18);
      --red: #f87171;
      --red-bg: rgba(239, 68, 68, 0.18);
      --amber: #fbbf24;
      --amber-bg: rgba(245, 158, 11, 0.18);
      --purple: #a78bfa;
      --purple-bg: rgba(139, 92, 246, 0.18);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-sub); }
    body {
      margin: 0; padding: 12px 16px 30px;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 12.5px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Buttons & Inputs */
    button {
      font-family: inherit; font-size: 11.8px; font-weight: 500; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      padding: 5px 10px; border-radius: 8px; transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: inline-flex; align-items: center; gap: 4px; box-shadow: var(--shadow-sm);
    }
    button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-0.5px); }
    button:active { transform: translateY(0); }
    button.primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-color: #1d4ed8; font-weight: 600; }
    button.primary:hover { opacity: 0.94; color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35); }
    button.danger { background: var(--red-bg); color: var(--red); border-color: rgba(220, 38, 38, 0.35); font-weight: 600; }
    button.success { background: var(--green-bg); color: var(--green); border-color: rgba(5, 150, 105, 0.35); font-weight: 600; }
    button.sm { padding: 3px 8px; font-size: 11px; border-radius: 6px; box-shadow: none; }
    button.chip { border-radius: 999px; padding: 3.5px 11px; font-size: 11.2px; box-shadow: none; }
    button.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    button.chip.alert-active { background: var(--red); color: #fff; border-color: var(--red); font-weight: 600; }

    input[type="text"], input[type="date"], input[type="time"], input[type="datetime-local"], input[type="number"], select, textarea {
      font-family: inherit; font-size: 12px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px; padding: 5px 9px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 2.5px var(--accent-soft);
    }
    textarea { resize: vertical; }

    /* Top Header */
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 55%, #0f172a 100%);
      color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.4px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.28);
    }
    .brand h1 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.2px; }
    .brand .sub { font-size: 11px; color: var(--text-sub); margin-top: 1px; }
    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    .pomodoro-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg-sub); border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-variant-numeric: tabular-nums;
      box-shadow: var(--shadow-sm);
    }
    .pomodoro-pill.running { border-color: var(--orange); background: var(--orange-bg); color: var(--orange); font-weight: 600; }

    .alert-ticker {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border-radius: 999px; font-weight: 700; font-size: 11.5px; cursor: pointer;
    }
    .alert-ticker.firing { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); animation: pulse 1.8s infinite; }
    .alert-ticker.calm { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.3); } 50% { box-shadow: 0 0 0 5px rgba(220,38,38,0); } }

    /* Live Amazon Multi-Timezone Strip */
    .tz-strip {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 7px 11px; margin-bottom: 10px; border-radius: 10px;
      background: var(--bg-sub); border: 1px solid var(--border); cursor: pointer;
      box-shadow: var(--shadow-sm); transition: border-color 0.15s;
    }
    .tz-strip:hover { border-color: var(--accent); }
    .tz-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2.5px 8px; border-radius: 7px; font-size: 11px;
      background: var(--bg); border: 1px solid var(--border); font-variant-numeric: tabular-nums;
    }
    .tz-pill.pst { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }

    /* Live Alert Banner */
    .firing-banner {
      background: var(--red-bg); border: 1px solid rgba(220, 38, 38, 0.45); color: var(--red);
      border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .firing-banner .fb-main { font-weight: 600; font-size: 12px; }

    /* Navigation Tabs & Filter Bar */
    .nav-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .nav-tabs {
      display: flex; flex-wrap: wrap; gap: 4px;
      background: var(--bg-sub); padding: 4px; border-radius: 10px; border: 1px solid var(--border);
    }
    .nav-tab {
      padding: 5.5px 11px; border-radius: 7px; font-weight: 600; font-size: 11.8px;
      background: transparent; border: 1px solid transparent; color: var(--text-sub); box-shadow: none;
    }
    .nav-tab:hover { color: var(--text); background: var(--bg); transform: none; }
    .nav-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow-sm); }

    .filter-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      background: var(--bg-sub); border: 1px solid var(--border); border-radius: 10px;
      padding: 7px 10px; margin-bottom: 11px;
    }
    .filter-bar input[type="text"] { min-width: 180px; flex: 1; max-width: 280px; }

    /* Pills */
    .pill { display: inline-flex; align-items: center; gap: 3px; padding: 1.5px 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .pill.P0, .pill.red { background: var(--red-bg); color: var(--red); }
    .pill.P1, .pill.amber { background: var(--amber-bg); color: var(--amber); }
    .pill.P2, .pill.blue { background: var(--accent-soft); color: var(--accent); }
    .pill.P3, .pill.gray { background: var(--bg-card); color: var(--text-sub); }
    .pill.green { background: var(--green-bg); color: var(--green); }
    .pill.purple { background: var(--purple-bg); color: var(--purple); }
    .pill.orange { background: var(--orange-bg); color: var(--orange); }

    /* Cards & Grids */
    .card {
      background: var(--bg-sub); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .card-hdr { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
    .card-title { font-size: 13px; font-weight: 700; margin: 0; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .kpi { background: var(--bg-sub); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; }
    .kpi .label { font-size: 10.8px; color: var(--text-sub); }
    .kpi .val { font-size: 18px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
    .kpi .meta { font-size: 10.5px; color: var(--text-sub); }

    /* Weekly Planner 7-Col Grid */
    .week-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 9px;
    }
    .week-grid {
      display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr));
      gap: 7px; overflow-x: auto; padding-bottom: 6px;
    }
    .day-col {
      background: var(--bg-sub); border: 1px solid var(--border); border-radius: 9px;
      min-height: 360px; display: flex; flex-direction: column; padding: 7px;
      transition: border-color 0.12s, background 0.12s;
    }
    .day-col.today { border: 2px solid var(--accent); background: var(--accent-soft); }
    .day-col.drag-over { border: 2px dashed var(--accent); background: var(--accent-soft); }
    .day-hdr {
      padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 4px;
    }
    .day-name { font-weight: 700; font-size: 12px; }
    .day-date { font-size: 10.6px; color: var(--text-sub); }
    .day-load { height: 4px; background: var(--bg-card); border-radius: 999px; overflow: hidden; margin-bottom: 6px; }
    .day-load-fill { height: 100%; background: var(--accent); }
    .day-load-fill.over { background: var(--red); }
    .day-cards { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .day-quick-add { margin-top: 6px; display: flex; gap: 4px; }
    .day-quick-add input { flex: 1; min-width: 0; font-size: 11px; padding: 3px 6px; }

    /* Task Card */
    .task-card {
      background: var(--bg); border: 1px solid var(--border); border-left: 3.5px solid var(--accent);
      border-radius: 7px; padding: 6px 7px; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
    }
    .task-card:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .task-card.p-P0 { border-left-color: var(--red); }
    .task-card.p-P1 { border-left-color: var(--amber); }
    .task-card.p-P2 { border-left-color: var(--accent); }
    .task-card.p-P3 { border-left-color: var(--text-sub); }
    .task-card.done { opacity: 0.62; }
    .task-card.done .tc-title { text-decoration: line-through; }
    .task-card.projected { border-style: dashed; background: rgba(99, 102, 241, 0.03); }
    .tc-top { display: flex; align-items: flex-start; gap: 5px; }
    .tc-chk { margin-top: 2px; cursor: pointer; flex-shrink: 0; accent-color: var(--green); }
    .tc-title { font-size: 11.6px; font-weight: 600; line-height: 1.35; word-break: break-word; flex: 1; }
    .tc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 5px; font-size: 10.3px; color: var(--text-sub); }
    .tc-prog { height: 3px; background: var(--bg-card); border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .tc-prog > div { height: 100%; background: var(--green); }

    /* Month Calendar */
    .cal-layout { display: grid; grid-template-columns: 1fr 290px; gap: 10px; align-items: start; }
    @media (max-width: 960px) { .cal-layout { grid-template-columns: 1fr; } }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .cal-dow {
      background: var(--bg-card); padding: 6px; text-align: center; font-weight: 700; font-size: 11.2px;
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--text-sub);
    }
    .cal-cell {
      min-height: 108px; background: var(--bg); padding: 5px;
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 3px; cursor: pointer;
    }
    .cal-cell.other-month { background: var(--bg-sub); opacity: 0.58; }
    .cal-cell.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
    .cal-cell.drag-over { background: var(--accent-soft); }
    .cal-cell-hdr { display: flex; justify-content: space-between; align-items: center; font-size: 11.2px; font-weight: 700; }
    .cal-today-num { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; }
    .cal-event {
      font-size: 10px; padding: 1px 4px; border-radius: 4px; color: #fff; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cal-pill {
      font-size: 10.4px; padding: 2px 5px; border-radius: 4px;
      background: var(--bg-sub); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 3px;
    }
    .cal-pill.p-P0 { border-left-color: var(--red); }
    .cal-pill.p-P1 { border-left-color: var(--amber); }
    .cal-pill.done { opacity: 0.55; text-decoration: line-through; }

    /* Kanban */
    .kanban-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
    .kanban-col {
      background: var(--bg-sub); border: 1px solid var(--border); border-radius: 9px;
      padding: 8px; min-height: 360px; display: flex; flex-direction: column; gap: 7px;
    }
    .kanban-col.drag-over { border: 2px dashed var(--accent); background: var(--accent-soft); }

    /* Gantt */
    .gantt-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
    .gantt-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .gantt-table th, .gantt-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 4px 6px; white-space: nowrap; }
    .gantt-table th { background: var(--bg-card); position: sticky; top: 0; z-index: 2; }
    .gantt-bar {
      height: 18px; border-radius: 5px; color: #fff; font-size: 10px; font-weight: 600;
      padding: 0 6px; display: flex; align-items: center; gap: 4px; cursor: pointer;
      position: relative; overflow: hidden;
    }
    .gantt-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,0.22); }

    /* List Table */
    .table-wrap { overflow-x: auto; max-height: 520px; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 11.6px; }
    table.data-table th, table.data-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    table.data-table th { background: var(--bg-card); position: sticky; top: 0; z-index: 2; color: var(--text-sub); font-size: 11px; }
    table.data-table th.sortable { cursor: pointer; }
    table.data-table tbody tr:hover td { background: var(--accent-soft); }

    /* Modal / Drawer */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); z-index: 90;
      display: none; align-items: center; justify-content: flex-end;
    }
    .modal-backdrop.open { display: flex; }
    .drawer {
      width: min(560px, 100vw); height: 100vh; background: var(--bg); border-left: 1px solid var(--border);
      padding: 14px 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      box-shadow: -8px 0 30px rgba(0,0,0,0.2);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-field { display: flex; flex-direction: column; gap: 3px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 11px; font-weight: 600; color: var(--text-sub); }
    .subtask-row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: var(--bg-sub); border-radius: 6px; }
    .alert-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 6px; padding: 7px 9px; background: var(--bg-sub); border: 1px solid var(--border); border-radius: 7px;
    }

    .toast {
      position: fixed; right: 16px; bottom: 16px; z-index: 120;
      background: #0f172a; color: #fff; padding: 8px 14px; border-radius: 8px;
      font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .toast.show { opacity: 1; }
    .empty { padding: 28px; text-align: center; color: var(--text-sub); }
  </style>
</head>
<body>
  <div id="root"><div class="empty">正在连接亚马逊运营计划看板...</div></div>

  <!-- Task & Alert Detail Drawer -->
  <div id="drawer-backdrop" class="modal-backdrop">
    <div id="drawer-panel" class="drawer"></div>
  </div>

  <!-- Generic Modal (Rule / OKR / Import) -->
  <div id="modal-backdrop" class="modal-backdrop" style="justify-content:center;">
    <div id="modal-panel" class="card" style="width:min(500px,94vw);max-height:88vh;overflow-y:auto;background:var(--bg);margin:0;"></div>
  </div>

  <div id="toast" class="toast"></div>
  <input id="import-file-input" type="file" accept=".json" style="display:none;" />
