<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西柚洞察·全维亚马逊跨境情报总台 (白昼专业版)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-elevated: #f1f5f9;
      --card-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --border-focus: #f97316;
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-glow: rgba(249, 115, 22, 0.18);
      --primary-subtle: #fff7ed;
      --accent: #0284c7;
      --accent-subtle: #f0f9ff;
      --cyan: #0284c7;
      --cyan-subtle: #f0f9ff;
      --success: #059669;
      --success-subtle: #ecfdf5;
      --warning: #d97706;
      --warning-subtle: #fffbeb;
      --danger: #e11d48;
      --danger-subtle: #fff1f2;
      --purple: #7c3aed;
      --purple-subtle: #f5f3ff;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.04);
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: var(--font);
      line-height: 1.5;
      font-size: 13px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    input, select, button, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
    }

    /* Common Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      user-select: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.28);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.36);
      transform: translateY(-1px);
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 11.5px;
      border-radius: var(--radius-xs);
    }

    /* Cards */
    .panel-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      line-height: 1.2;
    }
    .badge-emerald { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .badge-amber { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .badge-rose { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    .badge-purple { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
    .badge-cyan { background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
    .badge-orange { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }

    /* Json Output Box */
    .json-box {
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.6;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #0369a1;
      overflow-x: auto;
      max-height: 440px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Tool Catalog Split Pane */
    .tool-catalog-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .tool-catalog-item:hover {
      background: #f1f5f9;
      border-color: #e2e8f0;
    }
    .tool-catalog-item.active {
      background: #fff7ed;
      border-color: #fdba74;
    }

    .manifest-card:hover {
      border-color: #fdba74 !important;
      background: #fff7ed !important;
    }

    .hologram-chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      color: #0f172a;
      border: 1px solid #fed7aa;
      border-left: 4px solid #f97316;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.14), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      padding: 11px 18px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 9999;
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="app">
    <div style="background: #ffffff; padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 15px; font-weight: 800; color: #0f172a;">西柚洞察 · 全维亚马逊跨境情报总台</div>
      <div style="font-size: 11.5px; color: #64748b;">正在初始化白昼工作台...</div>
    </div>
  </div>
  <div id="toast"></div>

  <script type="module">
    /*__APP_BUNDLE__*/
  </script>
</body>
</html>
