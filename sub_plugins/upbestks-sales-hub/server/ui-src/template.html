<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPBestKS 销售数据可视化看板</title>
  <style>
    :root {
      --bg-canvas: var(--color-background-primary, #f8fafc);
      --bg-surface: var(--color-background-secondary, #ffffff);
      --bg-elevated: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-hover: #e2e8f0;
      
      --text-main: var(--color-text-primary, #0f172a);
      --text-muted: var(--color-text-secondary, #64748b);
      --text-light: #94a3b8;

      --border-subtle: #f1f5f9;
      --border-default: var(--color-border-primary, #e2e8f0);
      --border-strong: #cbd5e1;

      --primary: #2563eb;
      --primary-light: #3b82f6;
      --primary-soft: rgba(37, 99, 235, 0.08);
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);

      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.09);
      --purple-gradient: linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);

      --emerald: #059669;
      --emerald-soft: rgba(5, 150, 105, 0.09);
      --emerald-gradient: linear-gradient(135deg, #10b981 0%, #047857 100%);

      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.09);

      --rose: #e11d48;
      --rose-soft: rgba(225, 29, 72, 0.09);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.08), 0 4px 8px -2px rgba(15, 23, 42, 0.03);
      --shadow-glow: 0 0 20px -3px rgba(37, 99, 235, 0.2);

      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    [data-theme="dark"] {
      --bg-canvas: var(--color-background-primary, #090d16);
      --bg-surface: var(--color-background-secondary, #0f172a);
      --bg-elevated: #1e293b;
      --bg-subtle: #162032;
      --bg-hover: #1e293b;

      --text-main: var(--color-text-primary, #f8fafc);
      --text-muted: var(--color-text-secondary, #94a3b8);
      --text-light: #64748b;

      --border-subtle: #162032;
      --border-default: var(--color-border-primary, #334155);
      --border-strong: #475569;

      --primary: #60a5fa;
      --primary-light: #93c5fd;
      --primary-soft: rgba(96, 165, 250, 0.14);
      --primary-gradient: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);

      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.14);
      --purple-gradient: linear-gradient(135deg, #c084fc 0%, #7c3aed 100%);

      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.14);
      --emerald-gradient: linear-gradient(135deg, #34d399 0%, #059669 100%);

      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.14);

      --rose: #fb7185;
      --rose-soft: rgba(251, 113, 133, 0.14);

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 14px -2px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 12px 28px -4px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 24px -2px rgba(96, 165, 250, 0.28);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      padding: 14px 16px 36px;
      background: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-default);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    /* Top Bar Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.5px;
      box-shadow: var(--shadow-glow);
      flex-shrink: 0;
    }
    .brand-info h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 9999px;
      background: var(--emerald-soft);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .brand-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .brand-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .brand-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .brand-meta .sep {
      color: var(--border-strong);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      cursor: pointer;
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }
    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn.primary {
      background: var(--primary-gradient);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 2px 8px -1px rgba(37, 99, 235, 0.35);
    }
    .btn.primary:hover {
      opacity: 0.94;
      color: #ffffff;
      box-shadow: 0 4px 12px -1px rgba(37, 99, 235, 0.45);
    }

    /* Modern Segmented Navigation Tabs */
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      padding: 5px;
      background: var(--bg-subtle);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-default);
    }
    .tab-btn {
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn:hover {
      color: var(--text-main);
    }
    .tab-btn.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    .tab-btn .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 9999px;
      background: var(--bg-canvas);
      color: var(--text-muted);
      border: 1px solid var(--border-default);
    }
    .tab-btn.active .badge {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(37, 99, 235, 0.2);
    }

    /* Sub-Segment Switchers */
    .seg-bar {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 3px;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-default);
    }
    .seg-btn {
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.14s ease;
    }
    .seg-btn:hover {
      color: var(--text-main);
    }
    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    /* Executive KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 13px 15px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .kpi-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .kpi-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary-gradient);
      opacity: 0.85;
    }
    .kpi-card.emerald::before { background: var(--emerald-gradient); }
    .kpi-card.purple::before { background: var(--purple-gradient); }
    .kpi-card.amber::before { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .kpi-card.rose::before { background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); }

    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .kpi-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: -0.2px;
    }
    .kpi-icon-pill {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      background: var(--bg-subtle);
      color: var(--text-muted);
    }
    .kpi-val {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
    }
    .kpi-val small {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 2px;
    }
    .kpi-footer {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Executive Callout Banner */
    .exec-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 13px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background-image: radial-gradient(circle at 100% 0%, var(--primary-soft) 0%, transparent 60%);
    }
    .exec-banner-content h4 {
      margin: 0 0 3px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .exec-banner-content p {
      margin: 0;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 15px 17px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .card-hdr {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title {
      margin: 0;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }
    .card-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
    }

    /* Badges & Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .pill.emerald { background: var(--emerald-soft); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.2); }
    .pill.rose { background: var(--rose-soft); color: var(--rose); border: 1px solid rgba(225, 29, 72, 0.2); }
    .pill.amber { background: var(--amber-soft); color: var(--amber); border: 1px solid rgba(217, 119, 6, 0.2); }
    .pill.blue { background: var(--primary-soft); color: var(--primary); border: 1px solid rgba(37, 99, 235, 0.2); }
    .pill.purple { background: var(--purple-soft); color: var(--purple); border: 1px solid rgba(124, 58, 237, 0.2); }
    .pill.gray { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-default); }

    /* Tables */
    .tbl-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      box-shadow: inset 0 0 4px rgba(0,0,0,0.02);
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }
    th, td {
      padding: 8px 11px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    th {
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      position: sticky;
      top: 0;
      z-index: 2;
      user-select: none;
      border-bottom: 1px solid var(--border-default);
    }
    th:first-child, td:first-child { text-align: left; }
    tbody tr {
      transition: background 0.12s ease;
    }
    tbody tr:nth-child(even) td {
      background-color: rgba(241, 245, 249, 0.3);
    }
    [data-theme="dark"] tbody tr:nth-child(even) td {
      background-color: rgba(30, 41, 59, 0.25);
    }
    tbody tr:hover td {
      background-color: var(--primary-soft) !important;
    }
    .row-click {
      cursor: pointer;
    }

    /* Stack Bars */
    .stack-bar-wrap {
      background: var(--bg-subtle);
      border-radius: 9999px;
      padding: 3px;
      border: 1px solid var(--border-default);
      margin: 8px 0;
    }
    .stack-bar {
      display: flex;
      height: 12px;
      border-radius: 9999px;
      overflow: hidden;
    }
    .stack-segment {
      height: 100%;
      transition: width 0.3s ease;
    }

    /* Matrix Heatmap */
    .heat-cell {
      text-align: center !important;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      padding: 6px 4px !important;
      transition: all 0.12s ease;
      font-size: 11.5px;
    }
    .heat-cell:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 3;
      position: relative;
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      background: rgba(15, 23, 42, 0.94);
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: var(--radius-md);
      padding: 9px 13px;
      font-size: 11.5px;
      line-height: 1.55;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .tooltip-title {
      font-weight: 700;
      color: #ffffff;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Filters */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .inp-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }
    .inp-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      pointer-events: none;
      font-size: 13px;
    }
    .inp {
      width: 100%;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 7px 10px 7px 32px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-sm);
    }
    .inp:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .sel {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 7px 11px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease;
    }
    .sel:focus {
      border-color: var(--primary);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      background: #0f172a;
      color: #ffffff;
      padding: 9px 15px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      box-shadow: var(--shadow-lg);
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .loading-wrap {
      text-align: center;
      padding: 56px 16px;
      color: var(--text-muted);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-default);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* SVG Charts styling */
    .chart-box {
      position: relative;
      width: 100%;
      overflow: hidden;
    }
    svg.chart-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div style="font-weight:600;font-size:13px;color:var(--text-main);">正在加载 UPBestKS 销售与库存智能看板...</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">聚合 14 款手机壳型号 · 108 个全量 MSKU · 104 天销售趋势与 FBA 库存</div>
    </div>
  </div>
  <div id="tooltip" class="tooltip"></div>
  <div id="toast" class="toast"></div>
  <script type="module">/*__APP_BUNDLE__*/</script>
</body>
</html>
