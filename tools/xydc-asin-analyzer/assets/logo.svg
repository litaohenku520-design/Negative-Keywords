<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="grapefruitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5722" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle with Grapefruit Slice Theme -->
  <circle cx="24" cy="24" r="22" fill="#0F172A"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="url(#grapefruitGrad)" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Grapefruit Wedge / Radar Arc -->
  <path d="M24 24 L24 6 A18 18 0 0 1 39.5 33 Z" fill="url(#grapefruitGrad)" opacity="0.85" filter="url(#glow)"/>
  <path d="M24 24 L39.5 33 A18 18 0 0 1 8.5 33 Z" fill="#F43F5E" opacity="0.25"/>
  <path d="M24 24 L8.5 33 A18 18 0 0 1 24 6 Z" fill="#FF5722" opacity="0.4"/>
  
  <!-- Radar Target Grid Rings -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <circle cx="24" cy="24" r="8" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
  
  <!-- Center Core -->
  <circle cx="24" cy="24" r="3.5" fill="#FFFFFF"/>
  <circle cx="24" cy="24" r="2" fill="#FF5722"/>
  
  <!-- Search / Insight Lens Handle -->
  <path d="M33 33 L42 42" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="33" cy="33" r="3.5" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
</svg>
